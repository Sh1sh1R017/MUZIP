name: Trigger auto deployment for muzip

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/muzip-AutoDeployTrigger-df564042-982d-4781-880b-000e1bbff38f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MUZIP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MUZIP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MUZIP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.MUZIP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MUZIP_REGISTRY_PASSWORD }}
          containerAppName: muzip
          resourceGroup: muzip-rg
          imageToBuild: ghcr.io/muzip:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


